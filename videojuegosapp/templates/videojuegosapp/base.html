<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}GameStore{% endblock %}</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Paleta oscura estilo tienda digital */
        body {
            background-color: #171a21; 
            color: #c7d5e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .navbar {
            background-color: #1b2838;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        .navbar-brand {
            color: #ffffff !important;
            font-weight: 800;
            letter-spacing: 1px;
            font-size: 1.5rem;
        }

        /* Animación de entrada fluida */
        .fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.39, 0.57, 0.56, 1) both;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Estilo para los formularios (crear/editar) para que no queden blancos */
        .form-control, .form-select {
            background-color: #2a475e;
            border: 1px solid #1b2838;
            color: white;
        }
        .form-control:focus {
            background-color: #3b5f7c;
            color: white;
            box-shadow: 0 0 0 0.25rem rgba(102, 192, 244, 0.25);
            border-color: #66c0f4;
        }
        
        /* Botones personalizados */
        .btn-cyber {
            background-color: #66c0f4;
            color: #000;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .btn-cyber:hover {
            background-color: #4196c7;
            color: #fff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-5 py-3">
        <div class="container">
            <a class="navbar-brand" href="{% url 'inicio' %}">
                <i class="fa-solid fa-gamepad me-2 text-info"></i>GameStore
            </a>
            <div class="d-flex">
                <a href="{% url 'crear_videojuego' %}" class="btn btn-cyber">
                    <i class="fa-solid fa-plus me-1"></i> Añadir Juego al Catálogo
                </a>
            </div>
        </div>
    </nav>

    <!-- Contenedor dinámico con animación -->
    <div class="container fade-in mb-5">
        {% block contenido %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
