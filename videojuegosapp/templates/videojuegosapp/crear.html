{% extends 'videojuegosapp/base.html' %}

{% block titulo %}Agregar Videojuego{% endblock %}

{% block contenido %}
    <h1 class="mb-4">Agregar Videojuego</h1>

    {% if errores %}
        <div class="alert alert-danger">
            <ul class="mb-0">
                {% for error in errores %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label for="titulo" class="form-label">Título</label>
            <input type="text" class="form-control" id="titulo" name="titulo" value="{{ datos.titulo }}">
        </div>

        <div class="mb-3">
            <label for="genero" class="form-label">Género</label>
            <input type="text" class="form-control" id="genero" name="genero" value="{{ datos.genero }}">
        </div>

        <div class="mb-3">
            <label for="plataforma" class="form-label">Plataforma</label>
            <input type="text" class="form-control" id="plataforma" name="plataforma" value="{{ datos.plataforma }}">
        </div>

        <div class="mb-3">
            <label for="precio" class="form-label">Precio</label>
            <input type="number" step="0.01" class="form-control" id="precio" name="precio" value="{{ datos.precio }}">
        </div>

        <div class="mb-3">
            <label for="stock" class="form-label">Stock</label>
            <input type="number" class="form-control" id="stock" name="stock" value="{{ datos.stock }}">
        </div>

        <div class="mb-3">
            <label for="anio_lanzamiento" class="form-label">Año de lanzamiento</label>
            <input type="number" class="form-control" id="anio_lanzamiento" name="anio_lanzamiento" value="{{ datos.anio_lanzamiento }}">
        </div>

        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea class="form-control" id="descripcion" name="descripcion" rows="3">{{ datos.descripcion }}</textarea>
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="{% url 'inicio' %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
